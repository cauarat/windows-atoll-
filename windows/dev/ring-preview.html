<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Coucou — edge ring preview</title>
    <style>
      body { margin: 0; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      .wrap { width: 780px; margin: 10px auto; }
      .label { color: #888; margin: 10px 0 4px; }

               outline: 1px dashed #333; }

      .hit { position: absolute; outline: 1px solid rgba(255,80,80,.55); }
    </style>

    <div class="wrap" id="stages"></div>
