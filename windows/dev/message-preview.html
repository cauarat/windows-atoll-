<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Coucou — the message card, clamped and whole</title>
    <style>
      html, body { overflow: auto !important; height: auto !important;
                  width: auto !important; position: static !important; }
      body { margin: 0; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      h1 { font: 600 13px system-ui; color: #9aa; margin: 20px 0 2px; }
      .cols { display: flex; gap: 28px; padding: 16px 24px 40px; align-items: flex-start; }
      .col { flex: 0 0 640px; }
      .col > h1 { position: sticky; top: 0; background: #1b1b1f; padding: 8px 0; z-index: 9; }
      .label { color: #777; margin: 14px 0 4px; }
      .stage { position: relative; width: 640px; background: #000; border-radius: 22px; }
      .stage > .inner { position: absolute; inset: 8px 10px 10px; }
      /* Where the cap is, so a card that ran past it is obvious. */
      .cap { position: absolute; left: 0; right: 0; height: 1px; background: #f4505e88; z-index: 50; }
      .mochi { position: absolute; border: 1px dashed #22c55e99; border-radius: 50%; z-index: 50; }
    </style>
  </head>
  <body>
    <div class="cols">
      <div class="col" id="clamped"><h1>Two lines — the card that ships</h1></div>
      <div class="col" id="full"><h1>The whole message — grows, then scrolls at 650</h1></div>
    </div>
    <script type="module" src="./message-preview.ts"></script>
  </body>
</html>
