[package]
name = "coucou"
description = "Coucou for Windows and Linux — Mochi lives on the edge of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is Tauri's multiwebview: ChatGPT and the site are child webviews of
# the island's own window (web.rs). Pinned to 2.12.x, because an unstable API is
# allowed to move between minors — and with it on, every window's webview is a
# child webview, which web.rs::keep_hosting and the island's focus handling
# account for.
tauri = { version = "~2.12", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# The native file picker for the reply box. Tauri's own plugin rather than a
# fourth-party crate: Windows wants IFileOpenDialog and Linux wants the XDG
# portal, and this is the one maintained alongside the framework already here.
tauri-plugin-dialog = "2"
# Reading the clipboard in the background. The one place a dependency is not
# avoidable: Windows wants the Win32 clipboard API and Linux wants X11 and
# Wayland protocols, and hand-rolling either would still leave the other.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Copy on a message card puts a received photo on the clipboard as the image,
# which arboard takes as pixels. arboard already brings this crate for PNG;
# JPEG — what phones send — is the one decoder more, and its crate is already
# in the tree for TIFF.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Checks GitHub for a newer release and installs it on one click. Every package
# it will ever accept is signed with the key whose public half is the `pubkey`
# in tauri.conf.json, so a tampered or wrong-origin download is refused before
# it is run.
tauri-plugin-updater = "2"
# The shortcut that closes the island while another app has the keyboard. The
# framework's own plugin, for the reason the dialog is: RegisterHotKey on
# Windows and XGrabKey on Linux, each wanting a message loop of its own, is
# not worth hand-rolling twice. (Wayland lets no app grab keys; the settings
# window says so when registering fails.)
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
# `multipart` is what uploading a reply attachment needs; Mattermost takes
# files as form data and returns the ids the post then carries.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# The Mattermost and Ato sockets. rustls, like reqwest's, so there is one
# TLS stack in the binary and no system OpenSSL to find.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Ato's sign-in takes the password as md5(email + password), hex — the
# digest the panel computes in the browser. RustCrypto's, the one implementation
# worth trusting over a hand-rolled one for a single call.
md5 = { package = "md-5", version = "0.10" }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The WebView2 calls Tauri does not make for the pages in the island: their
# navigations' HTTP status and error, Escape, mute, the dark scheme, the
# rounded clip's window (platform/windows.rs). The bindings Tauri itself is
# built on — the same versions as wry's, so no second copy — and the
# windows-core they are written against, for its COM traits and types.
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  # GSMTC, for the Now Playing card: whatever is playing, whoever is playing it.
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_Foundation",
  # IAudioEndpointVolume on the default output: the Now Playing card's volume
  # row, the twin of SystemVolume.swift. Activate wants the PROPVARIANT pair.
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # The playing application's icon and window: its logo through AppInfo when it
  # is packaged, its executable's icon and its windows when it is not
  # (media_app.rs).
  "ApplicationModel",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  # DwmGetWindowAttribute(DWMWA_CLOAKED): the keyboard never goes back to a
  # window on another virtual desktop, which would switch the user back there.
  "Win32_Graphics_Dwm",
  # CreateRoundRectRgn and SetWindowRgn: the page's rounded corners.
  "Win32_Graphics_Gdi",
  # GetClipboardSequenceNumber: the clipboard poll opens the clipboard only
  # once something new has been copied.
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  # IVirtualDesktopManager: a window belongs to the virtual desktop it was created
  # on, so without this the island is left behind the moment the user switches.
  "Win32_UI_Shell",
  # RegisterApplicationRestart: the OS brings Coucou back after a crash or a
  # hang, and refuses to do it for a copy that ran under a minute — a
  # crash-loop guard we would otherwise have to write and tune ourselves.
  "Win32_System_Recovery",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# The WebKitGTK bindings wry is built on, for what a page window's WebKit says
# about its loads — how one failed, the main resource's HTTP status — and its
# dialogs and fullscreen setting (platform/linux.rs). Pinned to wry's own
# version, with wry's features, so there is one copy in the lock.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
