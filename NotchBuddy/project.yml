name: NotchBuddy
options:
  bundleIdPrefix: com.cauarati
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # Preencha com o seu Apple Developer Team ID antes de um build Release.
      DEVELOPMENT_TEAM: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Notchy.entitlements

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      # The Perl entry point for the adapter. It is Apple-signed /usr/bin/perl
      # that loads the framework, which is how the read stays permitted.
      - path: ../third_party/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    # Built from vendored source on every build, so a fresh clone needs nothing
    # but Xcode. Declaring the output lets Xcode skip it when it is current.
    preBuildScripts:
      - name: Build MediaRemoteAdapter
        script: |
          "$PROJECT_DIR/../scripts/build-mediaremote-adapter.sh" "$PROJECT_DIR/Frameworks"
        outputFiles:
          - $(PROJECT_DIR)/Frameworks/MediaRemoteAdapter.framework/Versions/A/MediaRemoteAdapter
    # link: false because nothing in Swift links against it -- only perl loads
    # it, by path. codeSign: true is what notarization needs.
    dependencies:
      - framework: Frameworks/MediaRemoteAdapter.framework
        embed: true
        codeSign: true
        link: false
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Notchy
        CFBundleDisplayName: Notchy
        CFBundleIdentifier: com.cauarati.Notchy
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "To jump to your terminal, send mail and control playback."
        NSAccessibilityUsageDescription: "To read the active window title and attach it as context."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cauarati.Notchy
        PRODUCT_NAME: Notchy
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
