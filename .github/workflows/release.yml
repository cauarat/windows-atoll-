name: Release (build check)

on:
  push:
    tags:
      - 'v*'

# A build check for a `v*` tag, which this fork has never cut — releases are
# `mac-v*` and go through .github/workflows/macos-release.yml. It is kept
# because a `v*` tag would otherwise publish nothing and say nothing; this at
# least proves the tree compiles on a clean machine.
jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build Release (no signing)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
