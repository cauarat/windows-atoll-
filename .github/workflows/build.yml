name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Diff engine tests
        run: bash scripts/test-diff-engine.sh

      - name: Island state machine tests
        run: bash scripts/test-island-fsm.sh

      - name: Island display tests
        run: bash scripts/test-island-displays.sh

      - name: Home content tests
        run: bash scripts/test-home-content.sh

      # Node, because the character suite also checks the TypeScript twin
      # agrees with the Swift one — the preset grid is exactly the kind of table
      # where one side gains an entry and nobody notices for a release.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mochi character tests
        run: bash scripts/test-mochi-character.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
