name: Build

# `notchy` is this repository's default branch; `main` does not exist. Written
# as main, none of the below had ever run on a pull request.
on:
  push:
    branches: [notchy]
  pull_request:
    branches: [notchy]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      # First, because it reads the source rather than compiling it: a
      # @MainActor closure on a background queue builds clean and traps at
      # runtime, so the build below cannot be what catches it.
      - name: Main-actor dispatch check
        run: bash scripts/test-mainactor-dispatch.sh

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test usage pricing
        run: bash scripts/test-usage-pricing.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Diff engine tests
        run: bash scripts/test-diff-engine.sh

      - name: Island state machine tests
        run: bash scripts/test-island-fsm.sh

      - name: Island display tests
        run: bash scripts/test-island-displays.sh

      - name: Island edge layout tests
        run: bash scripts/test-island-edges.sh

      - name: Island owner tests
        run: bash scripts/test-island-owner.sh

      - name: Pill open tests
        run: bash scripts/test-pill-open.sh

      - name: Radial chord tests
        run: bash scripts/test-radial-chord.sh

      - name: Claude account tests
        run: bash scripts/test-claude-account.sh

      - name: Home content tests
        run: bash scripts/test-home-content.sh

      # Both of these shipped with a script and no step, so they had never run
      # anywhere but on the machine that wrote them.
      - name: Notch site geometry tests
        run: bash scripts/test-notch-site-geometry.sh

      - name: Web chat policy tests
        run: bash scripts/test-webchat-policy.sh

      # Node, because the character suite also checks the TypeScript twin
      # agrees with the Swift one — the preset grid is exactly the kind of table
      # where one side gains an entry and nobody notices for a release.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node, and placed with the other Node suites for it: one catalogue feeds
      # the Mac, the Tauri frontend and the tray, so a string missing from it is
      # missing on three platforms at once.
      - name: Translation catalogue
        run: bash scripts/test-i18n.sh

      - name: Mochi character tests
        run: bash scripts/test-mochi-character.sh

      # Also a Swift/TypeScript pair: a limit or a kind gained on one side and
      # missed on the other means one platform refusing a file the other sends.
      - name: Reply attachment tests
        run: bash scripts/test-reply-attachments.sh

      # Windows and Linux only — there is a notch to retract into on a Mac, so
      # the Swift machine has no such preference and no half of this to check.
      - name: Island always-visible tests
        run: bash scripts/test-island-always-visible.sh

      # The other half of it: an island that never folds away still has to
      # shrink its window, or the cursor poll never parks.
      - name: Island resting-bar tests
        run: bash scripts/test-island-resting-bar.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
