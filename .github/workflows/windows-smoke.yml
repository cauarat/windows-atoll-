# A look at the real thing: builds the Windows app, starts it on a GitHub
# Windows runner and drives it the way a person would — clicks on the island,
# keys typed into what opens — photographing the desktop at each step. SSH
# cannot take Windows GUI screenshots and nothing on a Mac renders WebView2, so
# this is how a change to the island — a page drawn inside it, say — gets
# looked at before it reaches a PC.
#
# Runs by hand (`gh workflow run "Windows smoke" --ref <branch>`), or on a push
# to a claude/* branch whose head commit says [smoke]. The screenshots, the
# window tree and the keyboard's whereabouts at each one, and the app's log
# come back as the `smoke-shots` artifact: `gh run download <run> -n smoke-shots`.
name: Windows smoke

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      # Restored and saved as two steps, so a run whose screenshots go wrong
      # still leaves the next one a warm build.
      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-smoke-${{ hashFiles('windows/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-smoke-${{ hashFiles('windows/Cargo.lock') }}-
            windows-smoke-

      # A debug build, because the hook that opens a view on its own
      # (NOTCHY_SMOKE_VIEW) only exists in one; with the front end built in,
      # not served by Vite. The relay is built first because tauri.conf.json
      # bundles it, and the build refuses to start without it.
      - name: Build
        working-directory: windows
        shell: pwsh
        run: |
          npm ci
          cargo build --release -p coucou-hook
          npx tauri build --debug --no-bundle
          Get-ChildItem target/debug/*.exe | Format-Table Name, Length

      - name: Save the build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-smoke-${{ hashFiles('windows/Cargo.lock') }}-${{ github.sha }}

      - name: What the runner can show
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $wv2 = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 runtime: $($wv2.pv)"
          $s = [System.Windows.Forms.Screen]::PrimaryScreen
          "Screen: $($s.Bounds.Width)x$($s.Bounds.Height), work area $($s.WorkingArea)"

      # Scratch (claude/smoke-scratch only): the phone link on a real Windows desktop. A PowerShell
      # "phone" pairs over TLS with the certificate pinned and the token read from Credential
      # Manager, then allows a real coucou-hook PermissionRequest from the phone side.
      - name: Phone link end to end
        working-directory: windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $shots = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $report = Join-Path $shots 'phone-link.txt'
          $script:fails = 0
          function Note([string]$t) { $l = "[$(Get-Date -Format HH:mm:ss)] $t"; Write-Host $l; Add-Content -Path $report -Value $l }
          function Check($ok, [string]$what) { if ([bool]$ok) { Note "PASS $what" } else { $script:fails++; Note "FAIL $what" } }

          $cfg = Join-Path $env:APPDATA 'Coucou'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          $settings = [ordered]@{
            enabled = $true; soundEnabled = $false; soundVolume = 0.12; autoCloseInterval = 5.0
            activeIntegrations = @(); screen = 'primary'; autostart = $false; hooksInstalled = $true
            islandSnow = $false; christmasMusic = $false; autoUpdate = $false; userName = 'Smoke'
            onboardingVersion = 1; settingsVersion = 1
            pillCharacters = @{ integration_claude = 'crown:glossy:-' }
            phoneLink = $true; phoneDetails = $true
          }
          [System.IO.File]::WriteAllText((Join-Path $cfg 'settings.json'), ($settings | ConvertTo-Json), (New-Object System.Text.UTF8Encoding $false))

          $exe = (Resolve-Path 'target/debug/coucou.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $sub = [BitConverter]::ToInt32($bytes, 0x3C) + 4 + 20 + 68
          $bytes[$sub] = 2
          [System.IO.File]::WriteAllBytes($exe, $bytes)
          $proc = Start-Process -FilePath $exe -PassThru
          Note "launched $($proc.Id)"
          Start-Sleep -Seconds 35
          $log = Join-Path $env:LOCALAPPDATA 'Coucou\coucou.log'
          Note "log: $((Select-String -Path $log -Pattern 'phone link' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }) -join ' | ')"
          $listen = Get-NetTCPConnection -State Listen -LocalPort 47830 -ErrorAction SilentlyContinue
          Check ($null -ne $listen) "something listens on 47830 ($($listen.LocalAddress))"

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Cred {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct CREDENTIAL {
              public int Flags; public int Type; public string TargetName; public string Comment; public long LastWritten;
              public int CredentialBlobSize; public IntPtr CredentialBlob; public int Persist; public int AttributeCount;
              public IntPtr Attributes; public string TargetAlias; public string UserName;
            }
            [DllImport("advapi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern bool CredRead(string target, int type, int flags, out IntPtr cred);
            [DllImport("advapi32.dll")] public static extern void CredFree(IntPtr cred);
            public static string Read(string target) {
              IntPtr p;
              if (!CredRead(target, 1, 0, out p)) return null;
              try {
                var c = Marshal.PtrToStructure<CREDENTIAL>(p);
                var b = new byte[c.CredentialBlobSize];
                Marshal.Copy(c.CredentialBlob, b, 0, b.Length);
                return System.Text.Encoding.Unicode.GetString(b);
              } finally { CredFree(p); }
            }
          }
          '@
          $token = [Cred]::Read('phone-link-token.fr.louisraille.coucou')
          $certHex = [Cred]::Read('phone-link-cert.fr.louisraille.coucou')
          Check ($token -and $token.Length -eq 32) "the token is in Credential Manager ($($token.Length) chars)"
          Check ($certHex -and $certHex.Length -gt 200) "the certificate is in Credential Manager"
          $der = [Convert]::FromHexString($certHex)
          $script:fp = ([Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($der))).ToLower()
          Note "pinned fingerprint $($script:fp.Substring(0,16))…"
          $named = [byte[]](0x30,0x13,0x06,0x07,0x2A,0x86,0x48,0xCE,0x3D,0x02,0x01,0x06,0x08,0x2A,0x86,0x48,0xCE,0x3D,0x03,0x01,0x07)
          Check (([Convert]::ToHexString($der)).Contains([Convert]::ToHexString($named))) "the certificate names the P-256 curve"

          function Open-Phone {
            $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 47830)
            $cb = [System.Net.Security.RemoteCertificateValidationCallback]{
              param($s, $c, $ch, $e)
              return ($c.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256)).ToLower() -eq $script:fp
            }
            $ssl = [System.Net.Security.SslStream]::new($tcp.GetStream(), $false, $cb)
            $ssl.AuthenticateAsClient('notchy')
            $ssl.ReadTimeout = 10000
            $r = [System.IO.StreamReader]::new($ssl, [System.Text.UTF8Encoding]::new($false))
            $w = [System.IO.StreamWriter]::new($ssl, [System.Text.UTF8Encoding]::new($false))
            $w.NewLine = "`n"; $w.AutoFlush = $true
            return @{ tcp = $tcp; ssl = $ssl; r = $r; w = $w; proto = $ssl.SslProtocol }
          }
          function Say($p, $obj) { $p.w.WriteLine(($obj | ConvertTo-Json -Compress -Depth 6)) }
          function Hear($p) { try { $l = $p.r.ReadLine(); if ($l) { Note "  <- $($l.Substring(0, [Math]::Min(400, $l.Length)))"; return $l | ConvertFrom-Json } } catch { Note "  read: $($_.Exception.Message)" }; return $null }
          function Expect($p, [string]$type) { for ($i = 0; $i -lt 12; $i++) { $m = Hear $p; if (-not $m) { return $null }; if ($m.type -eq $type) { return $m } }; return $null }

          try {
            $bad = Open-Phone
            Note "TLS: $($bad.proto)"
            Say $bad @{ type = 'hello'; v = 1; token = ('x' * 32); device = 'Intruder' }
            $m = Hear $bad
            Check ($m -and $m.type -eq 'error' -and $m.code -eq 'auth') "a wrong token is refused with auth"
            $bad.tcp.Close()

            $phone = Open-Phone
            Say $phone @{ type = 'hello'; v = 1; token = $token; device = 'Smoke phone'; caps = @('details', 'character', 'chat', 'diffs', 'usage') }
            $welcome = Expect $phone 'welcome'
            Check ($welcome -ne $null) "the paired phone is welcomed"
            Check (($welcome.caps -join ',') -eq 'details,character') "offered details,character (chat and diffs off, usage never): $($welcome.caps -join ',')"
            Check ($welcome.os -eq 'windows') "os is windows"
            $sessions = Expect $phone 'sessions'
            $claude = $sessions.sessions | Where-Object { $_.pillId -eq 'integration_claude' }
            Check ($claude -ne $null) "the Claude Code session is listed"
            Check ($claude.character.accessory -eq 'crown' -and $claude.character.eye -eq 'glossy') "its Mochi wears the crown and glossy eyes"

            $hook = (Resolve-Path 'target/release/coucou-hook.exe').Path
            $in = Join-Path $env:RUNNER_TEMP 'hook-in.json'
            $out = Join-Path $env:RUNNER_TEMP 'hook-out.json'
            [System.IO.File]::WriteAllText($in, '{"hook_event_name":"PermissionRequest","session_id":"smoke-1","cwd":"C:\\work\\smoke","tool_name":"Bash","tool_input":{"command":"npm test"}}', (New-Object System.Text.UTF8Encoding $false))
            $hp = Start-Process -FilePath $hook -ArgumentList 'PermissionRequest' -RedirectStandardInput $in -RedirectStandardOutput $out -PassThru -NoNewWindow
            $approval = Expect $phone 'approval'
            Check ($approval -and $approval.tool -eq 'Bash' -and $approval.command -eq 'npm test' -and -not $approval.truncated) "the request reaches the phone as Bash / npm test"
            Say $phone @{ type = 'decision'; fingerprint = ('0' * 64); decision = 'allow' }
            Say $phone @{ type = 'ping' }
            $null = Expect $phone 'pong'
            Check (-not $hp.HasExited) "a decision with another fingerprint changes nothing"
            Say $phone @{ type = 'decision'; fingerprint = $approval.fingerprint; decision = 'allow' }
            $resolved = Expect $phone 'approvalResolved'
            Check ($resolved -and $resolved.fingerprint -eq $approval.fingerprint) "the phone is told it was answered"
            $hp.WaitForExit(20000) | Out-Null
            $answer = Get-Content $out -Raw -ErrorAction SilentlyContinue
            Note "hook said: $answer"
            Check ($answer -match '"behavior":"allow"') "coucou-hook answered Claude Code: allow"
            Say $phone @{ type = 'bye' }
          } catch {
            $script:fails++
            Note "FAIL $($_.Exception.ToString())"
          }
          Start-Sleep -Seconds 2
          Note "log: $((Select-String -Path $log -Pattern 'phone link|decision' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }) -join ' | ')"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Copy-Item $log $shots -ErrorAction SilentlyContinue
          Note "failures: $($script:fails)"
          if ($script:fails -gt 0) { exit 1 }

      - name: The phone link's tests on Windows
        if: always()
        working-directory: windows
        shell: pwsh
        run: |
          cargo test -p coucou phone_link 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'shots/cargo-test.txt')
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: ${{ runner.temp }}/shots
          retention-days: 7
