name: macOS release

# Builds the .dmg offered on docs/download.html and attaches it to a release.
#
# Triggered by tags like `mac-v0.1.0`, and by hand for a dry run. The Windows
# and Linux workflows are untouched: this one only ever builds the Mac app.
#
# What it produces is NOT signed with a Developer ID and NOT notarized. A GitHub
# runner has no certificate and no notarytool profile, and adding them means
# putting an Apple identity in this repository's secrets — a decision for the
# person who owns that identity, not for this file. macOS therefore warns on
# first open; docs/download.html says so and gives the per-app way through.
#
# There is no notarized path any more and no second way to cut a release: this
# workflow is it. What that would take, if a Developer ID ever appears — a
# `Developer ID Application` identity, DEVELOPMENT_TEAM filled in in
# project.yml, the hardened-runtime tripwire in package-mac-dmg.sh moved, and
# notarytool/stapler steps after the package step — is additive, and nothing
# here is built on its absence.
#
# What it does do is write the Sparkle appcast (scripts/make-appcast.sh), which
# is what installed copies auto-update from. That used to be done by hand and
# so was usually not done at all.

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-latest, not a pinned macos-15: the app needs a newer Xcode than
    # that image carries, and pinned is how this workflow failed the only time
    # it ever ran. build.yml compiles the same Release configuration on
    # macos-latest and passes, so the two now build on the same thing.
    #
    # The deployment target is what decides who can run the result, and that
    # stays at macOS 15 in project.yml. Building on a newer host does not move
    # it.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # package-mac-dmg.sh stamps the branch and commit into Info.plist, so
          # it needs more than the shallow default to describe the tag.
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and package
        run: scripts/package-mac-dmg.sh dist

      # Proves the bundle inside the image is whole and self-consistent. This
      # is the check that catches the failure that actually bites: a bundle
      # Xcode left linker-signed arrives on another Mac as "damaged", with no
      # way past it, and it looks exactly like a corrupted download.
      - name: Verify the packaged app
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg)
          MOUNT=$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | awk '{print $NF}')
          codesign --verify --deep --strict "$MOUNT/Notchy.app"
          # Asserted, not printed. The release notes say "Universal: Intel and
          # Apple silicon" on every build; until now nothing checked, so a
          # single-architecture build would have shipped under that sentence.
          ARCHS=$(lipo -archs "$MOUNT/Notchy.app/Contents/MacOS/Notchy")
          echo "architectures: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) hdiutil detach "$MOUNT" -quiet; echo "::error::not universal: $ARCHS"; exit 1 ;;
          esac
          test -L "$MOUNT/Applications"
          test -f "$MOUNT/.DS_Store" || echo "::warning::no window layout in the image"
          hdiutil detach "$MOUNT" -quiet

      # A copy under a name that never changes, so there is one URL that is
      # always the current build: /releases/latest/download/Notchy-macOS.dmg,
      # and the same name on the rolling mac-latest tag below. docs/install.sh
      # and the README both point at it. The versioned file ships too — it is
      # what the appcast names, and what anyone keeping an old build wants.
      - name: Name a stable copy and write the checksums
        run: |
          set -euo pipefail
          cd dist
          cp Notchy-macOS-*.dmg Notchy-macOS.dmg
          shasum -a 256 Notchy-macOS-*.dmg Notchy-macOS.dmg > SHA256SUMS
          cat SHA256SUMS

      # Every installed copy learns about this release from the appcast and
      # from nowhere else. Signing needs the private half of the SUPublicEDKey
      # that is baked into the app; without the secret there is no way to
      # produce one a client would accept, so the release still goes out — a
      # download that works beats a release that failed — and says loudly that
      # existing copies will not see it.
      - name: Write the Sparkle appcast
        id: appcast
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#mac-v}"
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::warning::No SPARKLE_PRIVATE_KEY secret, so no appcast: installed copies will not be offered this update. Add the secret (Sparkle's generate_keys -x exports it) and re-run."
            echo "written=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Notchy-macOS-$VERSION.dmg"
          scripts/make-appcast.sh "dist/Notchy-macOS-$VERSION.dmg" "$VERSION" "$URL" dist/appcast.xml
          echo "written=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Notchy-macOS-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/appcast.xml
          if-no-files-found: error

      # Only on a tag. A dry run builds and verifies and publishes nothing.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#mac-v}"
          # --latest=false, then pinned deliberately at the end of this job.
          # Sparkle reads its feed from /releases/latest/download/appcast.xml,
          # so whichever release wears the Latest badge is the one every
          # installed copy asks about updates — it has to be a macOS release
          # carrying an appcast, which since this workflow started writing one
          # means the newest `mac-v*`.
          #
          # The flag alone does not hold: it declines to pin this release, and
          # GitHub then falls back to whichever non-draft release has the
          # newest created_at — this one. The "Pin the Latest badge" step is
          # what settles it.
          ASSETS=(dist/Notchy-macOS-"$VERSION".dmg dist/Notchy-macOS.dmg dist/SHA256SUMS)
          [ -f dist/appcast.xml ] && ASSETS+=(dist/appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Notchy for macOS $VERSION" \
            --notes "Requires macOS 15 or later. Universal: Intel and Apple silicon.

          **One line, and no dialog at all:**

          \`\`\`
          curl -fsSL https://cauarat.github.io/windows-atoll-/install.sh | bash
          \`\`\`

          The quarantine flag that makes macOS ask is set by whatever downloads a file.
          Browsers set it; \`curl\` does not. So the copy that command installs is never
          assessed by Gatekeeper and simply opens. Nothing is turned off.

          **Or the .dmg**, which is the same build and arrives through a browser, so it is
          flagged. This build is **not signed with an Apple Developer ID and not notarized**:

          1. Open the .dmg and drag **Notchy** into **Applications**.
          2. Open it **from Applications**, not from the installer window — a copy opened
             there runs from the disk image, and Notchy will offer to move itself.
          3. macOS refuses once. **System Settings → Privacy & Security**, scroll to the
             message naming Notchy, **Open Anyway**. Once per Mac.

          Full steps in English, Spanish and Portuguese are on the
          [download page](https://cauarat.github.io/windows-atoll-/download.html?go=mac).
          \`SHA256SUMS\` below is the checksum of each file here." \
            --latest=false

      # The rolling tag, the same shape windows.yml and linux.yml already use:
      # one release whose asset names never change, so a link written down
      # anywhere stays correct. This is what docs/install.sh fetches, and what
      # the README and the download page fall back to.
      - name: Update the rolling mac-latest release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#mac-v}"
          ASSETS=(dist/Notchy-macOS.dmg dist/SHA256SUMS)
          if gh release view mac-latest >/dev/null 2>&1; then
            # The tag has to follow the release, or mac-latest keeps pointing at
            # the first commit it was ever made from and anyone building from it
            # gets an old tree.
            git tag -f mac-latest "$GITHUB_SHA"
            git push -f origin mac-latest
            gh release edit mac-latest \
              --title "Notchy for macOS (latest)" \
              --notes "Always the newest macOS build — currently $VERSION.

          Install it in one line:

          \`\`\`
          curl -fsSL https://cauarat.github.io/windows-atoll-/install.sh | bash
          \`\`\`

          Or take \`Notchy-macOS.dmg\` below; the [download page](https://cauarat.github.io/windows-atoll-/download.html?go=mac) has the steps."
            # The image first, the appcast last. --clobber removes an asset
            # before it uploads the replacement, so a client checking in that
            # gap gets a 404 on whatever is mid-swap. Keeping that gap off the
            # file every client reads first means the feed never announces a
            # version whose download is not up yet.
            gh release upload mac-latest "${ASSETS[@]}" --clobber
            if [ -f dist/appcast.xml ]; then
              gh release upload mac-latest dist/appcast.xml --clobber
            fi
          else
            [ -f dist/appcast.xml ] && ASSETS+=(dist/appcast.xml)
            gh release create mac-latest "${ASSETS[@]}" \
              --title "Notchy for macOS (latest)" \
              --notes "Always the newest macOS build — currently $VERSION." \
              --latest=false
          fi

      # Last, because it has to run after the release above exists.
      # `always()` so a half-published run still leaves the badge where it
      # belongs.
      - name: Pin the Latest badge on the macOS release that owns it
        if: always() && startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pin-latest-release.sh "$GITHUB_REPOSITORY"
