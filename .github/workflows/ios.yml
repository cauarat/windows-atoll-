name: iPhone

# Notchy for iPhone (ios/): a simulator build on every pull request that touches it or the Mac sources
# it compiles, and an unsigned Notchy.ipa on a tag like `ios-v0.1.0`, for SideStore or AltStore to sign
# with each user's own Apple ID (docs/IPHONE.md). TestFlight needs a paid Apple Developer membership and
# runs from a Mac with ios/scripts/testflight.sh; nothing here holds an Apple identity.
#
# The job is called `iphone`, not `build`: three jobs already share that name, and a required check
# named `build` would wait on the wrong one.

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'NotchBuddy/Sources/App/BotEngine.swift'
      - 'NotchBuddy/Sources/App/EyeShape.swift'
      - 'NotchBuddy/Sources/App/Mochi*.swift'
      - 'NotchBuddy/Sources/App/IslandTypes.swift'
      - 'NotchBuddy/Sources/App/IslandScreenGeometry.swift'
      - 'NotchBuddy/Sources/App/HomeContent.swift'
      - 'NotchBuddy/Sources/App/MessageSource.swift'
      - 'NotchBuddy/Sources/App/ChatMarkdown*.swift'
      - 'NotchBuddy/Sources/App/ChatSparkleIcon.swift'
      - 'NotchBuddy/Sources/App/SafeWebURL.swift'
      - 'NotchBuddy/Sources/App/PhoneLink/PhoneLinkProtocol.swift'
      - 'NotchBuddy/Resources/Localizations/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -project NotchyPhone.xcodeproj -scheme Notchy -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build build CODE_SIGNING_ALLOWED=NO

      - name: Version
        id: version
        working-directory: ios
        run: echo "version=$(sed -nE 's/^ *MARKETING_VERSION: "([^"]+)".*/\1/p' project.yml)" >> "$GITHUB_OUTPUT"

      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          tag="${GITHUB_REF_NAME#ios-v}"
          [ "$tag" = "${{ steps.version.outputs.version }}" ] || { echo "Tag $tag but project.yml says ${{ steps.version.outputs.version }}"; exit 1; }

      - name: Unsigned .ipa
        if: startsWith(github.ref, 'refs/tags/ios-v') || github.event_name == 'workflow_dispatch'
        working-directory: ios
        run: |
          xcodebuild -project NotchyPhone.xcodeproj -scheme Notchy -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Notchy.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -R build/Notchy.xcarchive/Products/Applications/Notchy.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Notchy.ipa Payload)
          ls -la build/Notchy.ipa

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ios-v') || github.event_name == 'workflow_dispatch'
        with:
          name: Notchy-iPhone
          path: ios/build/Notchy.ipa

  publish:
    needs: iphone
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Notchy-iPhone }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest=false: the Latest slot belongs to the macOS release (its appcast lives there).
          gh release create "$GITHUB_REF_NAME" Notchy.ipa --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Notchy for iPhone ${GITHUB_REF_NAME#ios-v}" \
            --notes "Unsigned: install it with SideStore or AltStore, which sign it with your own Apple ID. See docs/IPHONE.md."
