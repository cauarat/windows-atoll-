name: Linux

# Builds the Linux app (AppImage, .deb, .rpm) from the same Tauri project as
# Windows. Triggered by tags like `linux-v0.1.0`, by hand, and by pull requests
# that touch windows/ or this file (build and test only); the macOS and Windows
# workflows are untouched.
#
# Two jobs on purpose. `build` runs npm, cargo and the AppImage tooling (which
# downloads its own helpers) with a read-only token that is not even kept on
# disk. Only `publish`, which runs none of that code, may write to the repo.

on:
  push:
    tags:
      - 'linux-v*'
  workflow_dispatch:
  # Build and test only. A pull request never uploads artifacts and never
  # reaches the publish job (see the two gates below), and a fork's token is
  # read-only anyway.
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

# Off until a first build has been checked by hand: run this workflow manually,
# download the Notchy-Linux artifact, try it, then set this to 'true' and push a
# linux-v* tag.
env:
  PUBLISH: 'false'

jobs:
  build:
    # The oldest supported Ubuntu: an AppImage only runs on systems whose glibc
    # is at least as new as the one it was built against.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.pack.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # webkit2gtk, gtk-layer-shell and appindicator to build against; patchelf
      # and the GStreamer plugins for the AppImage, which carries its own
      # GStreamer so the sounds play (WAV needs wavparse, in -good).
      - name: Install system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: linux-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install dependencies
        run: npm ci

      # Same check as the Windows workflow: three files carry the version.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: |
          tag="${GITHUB_REF_NAME#linux-v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -nE 's/^version\s*=\s*"(.+)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          bad=""
          [ "$tag" = "$conf" ]  || bad="$bad tauri.conf.json says $conf;"
          [ "$tag" = "$pkg" ]   || bad="$bad package.json says $pkg;"
          [ "$tag" = "$cargo" ] || bad="$bad Cargo.toml says $cargo;"
          if [ -n "$bad" ]; then echo "tag says $tag but$bad"; exit 1; fi

      # createUpdaterArtifacts signs the AppImage, so the build needs a key.
      # A tag signs with the real one; a pull request cannot see secrets at all
      # from a fork, so it signs with a throwaway generated here and keeps one
      # build path. A tag without the real key is refused: an AppImage signed by
      # the wrong key is one no installed copy would ever accept.
      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          path="$RUNNER_TEMP/coucou-updater.key"
          if [ -n "$SIGNING_KEY" ]; then
            # No trailing newline: the key is one base64 blob with no line
            # break of its own, and a stray one sends the decoder past the
            # "==" padding. Same fix as windows.yml.
            printf '%s' "$SIGNING_KEY" > "$path"
            echo "Signing with the release key."
          elif [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. A published AppImage has to be signed with the release key or no installed copy can ever update to it." >&2
            exit 1
          else
            npx tauri signer generate -w "$path" -p '' --force
            echo "No release key here: signing with a throwaway. This build must not be published."
          fi
          chmod 600 "$path"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$path"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # The app bundles target/release/coucou-hook as a resource, and its build
      # script refuses to run until that file exists.
      - name: Test
        run: |
          cargo build --release -p coucou-hook
          cargo test --workspace

      # linuxdeploy is itself an AppImage; runners have no FUSE, so it unpacks
      # itself instead of mounting.
      - name: Build and pack
        id: pack
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run pack
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The manifest the installed copies fetch. Written on every run, not
          # only on a tag, so a mistake in the script surfaces here rather than
          # on the one run that publishes. Only the AppImage is listed: a .deb
          # or .rpm belongs to apt or dnf and must not be replaced behind them.
          node scripts/update-manifest.mjs linux-x86_64 \
            "Notchy-Linux-$version-x86_64.AppImage" "$GITHUB_REF_NAME"
          cd release
          sha256sum Notchy-Linux-* > SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Decide whether to publish
        id: gate
        run: echo "publish=${{ github.event_name == 'push' && env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/linux-v') }}" >> "$GITHUB_OUTPUT"

      # Upload only on a manual run or when publishing a release, as on Windows.
      # The repo is public, so artifacts are downloadable by any signed-in GitHub
      # user; retention-days: 3 limits exposure.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.publish == 'true'
        with:
          name: Notchy-Linux
          path: |
            windows/release/Notchy-Linux-*
            windows/release/SHA256SUMS
            windows/release/latest.json
          retention-days: 3

  publish:
    needs: build
    # Checked again here, so a pull request can never get this far whatever
    # the build job reports.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/linux-v') && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # For the linux-latest tag below and for pin-latest-release.sh at the
      # end of this job — both from the tagged tree this workflow is itself
      # read from. Nothing the build produced is run here.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Notchy-Linux
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          v="$VERSION"
          notes="Notchy for Linux $v — Mochi at the top of your screen.

          - **AppImage** (any distribution): \`chmod +x Notchy-Linux-$v-x86_64.AppImage\` and run it.
          - **Debian / Ubuntu**: \`sudo apt install ./Notchy-Linux-$v-amd64.deb\`
          - **Fedora / openSUSE**: \`sudo dnf install ./Notchy-Linux-$v-x86_64.rpm\`

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`.

          The island sits on the top edge on compositors with layer-shell (COSMIC,
          KDE Plasma, Hyprland, Sway…). On GNOME it opens as a regular window."
          # --latest=false declines to pin this release as Latest, which is
          # right but is not enough on its own: GitHub falls back to whichever
          # non-draft release has the newest created_at, so a Linux tag takes
          # the badge anyway. The macOS releases own that slot, and the "Pin the
          # Latest badge" step at the end of this job is what puts it back.
          gh release create "$GITHUB_REF_NAME" \
            "release/Notchy-Linux-$v-x86_64.AppImage" \
            "release/Notchy-Linux-$v-amd64.deb" \
            "release/Notchy-Linux-$v-x86_64.rpm" \
            "release/SHA256SUMS" \
            --title "Notchy for Linux $v" \
            --notes "$notes" \
            --latest=false

      - name: Update the rolling linux-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          v="$VERSION"
          if gh release view linux-latest >/dev/null 2>&1; then
            # The tag has to follow the release, as for windows-latest.
            git tag -f linux-latest "$GITHUB_SHA"
            git push -f origin linux-latest
            gh release edit linux-latest --title "Notchy for Linux (latest)" --notes "Always the newest Linux build — currently $v."
            # Package first, manifest second, for the reason windows.yml gives:
            # --clobber deletes before it uploads, and a check landing in that
            # gap gets a 404 it cannot tell apart from a broken network.
            gh release upload linux-latest "release/Notchy-Linux-x86_64.AppImage" --clobber
            gh release upload linux-latest "release/latest.json" --clobber
          else
            gh release create linux-latest \
              "release/Notchy-Linux-x86_64.AppImage" \
              "release/latest.json" \
              --title "Notchy for Linux (latest)" \
              --notes "Always the newest Linux build — currently $v." \
              --latest=false
          fi

      # Last, because it has to run after every release this job publishes.
      # `always()` so a half-published run still leaves the badge where it
      # belongs rather than on a Linux AppImage.
      - name: Pin the Latest badge back on the macOS release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pin-latest-release.sh "$GITHUB_REPOSITORY"
