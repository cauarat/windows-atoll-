name: Windows

# Builds the Windows app and publishes the installer.
# Triggered by tags like `windows-v0.1.0`; the macOS workflows are untouched.

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: write

# Publishing is on. Neither package is code-signed yet, so SmartScreen warns on
# first run and Defender has previously false-positived the NSIS installer as
# Trojan:Win32/Wacatac.H!ml. That is why every release also carries the portable
# .zip: bare binaries, no NSIS stub, which is what the ML model reacts to.
# Both are documented in the release notes.
env:
  PUBLISH: 'true'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # The hook is built first on purpose: tauri.conf.json bundles
      # coucou-hook.exe as a resource, so the build script refuses to run until
      # it exists — which means the main crate will not even compile its tests
      # without it. The Windows crate cannot be built on a Mac at all (the hook
      # is #[cfg]-gated to Windows and Linux), so this runner is the only place
      # these tests ever run.
      - name: Test
        shell: pwsh
        run: |
          cargo build --release -p coucou-hook
          cargo test --workspace

      # `npm run build` (run by tauri as beforeBuildCommand) builds coucou-hook
      # first, which tauri.conf.json then bundles as a resource. `pack` then
      # copies the installer out of target/ under its shipping name.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      # The portable package: the two binaries side by side, which is exactly
      # the layout ensure_hook_exe() in hooks.rs falls back to, so Claude Code
      # hooks work with no installer. The shortcut script gives it a Start Menu
      # entry, because an app with no window and no taskbar button is otherwise
      # hard to launch a second time.
      - name: Pack the portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $stage = "release/portable/Coucou"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/coucou.exe      $stage/
          Copy-Item target/release/coucou-hook.exe $stage/
          Copy-Item portable/README.txt            $stage/
          Copy-Item 'portable/Add to Start Menu.cmd' $stage/
          Copy-Item portable/setup-shortcuts.ps1   $stage/
          # Compress-Archive is in Windows PowerShell itself: no extra tooling.
          Compress-Archive -Path "release/portable/Coucou" `
                           -DestinationPath "release/Coucou-Windows-$v-portable.zip" -Force
          Copy-Item "release/Coucou-Windows-$v-portable.zip" "release/Coucou-Windows-portable.zip" -Force
          Remove-Item release/portable -Recurse -Force
          Get-ChildItem release | Format-Table Name, Length

      # Artifacts need a signed-in GitHub account to download, so they are a
      # convenience for us, not the download path for users: that is the
      # release below. retention-days: 3 keeps them from piling up.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: Coucou-Windows-setup
          path: windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: Coucou-Windows-portable
          path: windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-portable.zip
          retention-days: 3

      - name: Publish the release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $notes = @"
          Mochi at the top of your screen, watching your Claude Code sessions.

          ## Download

          | | |
          |---|---|
          | **``Coucou-Windows-$v-setup.exe``** | The installer. Installs for your user only — no admin prompt. |
          | **``Coucou-Windows-$v-portable.zip``** | No installer. Unzip, run ``coucou.exe``. Use this if Defender objects to the installer. |

          ## First run

          Neither package is code-signed yet, so Windows shows **"Windows protected your PC"**. Click **More info → Run anyway**.

          There is no window and no taskbar entry — that is normal. Mochi lives at the top centre of the screen and in the notification area next to the clock.

          Then: notification-area icon → **Settings… → Claude Code → Install hooks…**. You get the exact diff of what changes in ``%USERPROFILE%\.claude\settings.json`` and the path of the dated backup taken first. Nothing is written until you click.

          If Defender quarantines the installer it is a false positive on unsigned Rust binaries (``Trojan:Win32/Wacatac.H!ml``) — take the portable .zip instead.
          "@
          # --latest=false is not cosmetic: without it GitHub hands "Latest" to
          # whichever release was published last, and the site's Download for Mac
          # button points at /releases/latest. A Windows tag would silently send
          # Mac users to the .exe. The macOS `v*` releases own that slot.
          gh release create "${{ github.ref_name }}" `
            "release/Coucou-Windows-$v-setup.exe" `
            "release/Coucou-Windows-$v-portable.zip" `
            --title "Coucou for Windows $v" `
            --notes $notes `
            --latest=false

      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The tag has to follow the release, or windows-latest keeps pointing
            # at the first commit it was ever created from and anyone building
            # from it gets an old tree.
            git tag -f windows-latest "${{ github.sha }}"
            git push -f origin windows-latest
            gh release edit windows-latest --title "Coucou for Windows (latest)" --notes "Always the newest Windows build — currently $v."
            gh release upload windows-latest "release/Coucou-Windows-setup.exe" "release/Coucou-Windows-portable.zip" --clobber
          } else {
            gh release create windows-latest `
              "release/Coucou-Windows-setup.exe" `
              "release/Coucou-Windows-portable.zip" `
              --title "Coucou for Windows (latest)" `
              --notes "Always the newest Windows build — currently $v." `
              --latest=false
          }
